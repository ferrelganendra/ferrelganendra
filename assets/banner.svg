<?xml version="1.0" encoding="UTF-8"?>
<!-- Custom animated banner - dark cinematic, Ferrel's brand (#0A0A0C base, red #FF3B30 accent) -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A0A0C" stop-opacity="0"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
      <animate attributeName="r" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1b1b1f" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="900" height="220" fill="#0A0A0C"/>
  <rect width="900" height="220" fill="url(#grid)" opacity="0.5"/>

  <!-- bottom red glow sweep -->
  <rect x="-50" y="120" width="1000" height="160" fill="url(#glow)"/>

  <!-- pulsing orb -->
  <circle cx="780" cy="150" r="60" fill="url(#pulse)"/>

  <!-- floating particles -->
  <g fill="#FF3B30" opacity="0.7">
    <circle cx="120" cy="50" r="2">
      <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="170" r="1.5">
      <animate attributeName="cy" values="170;155;170" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="40" r="2.5">
      <animate attributeName="cy" values="40;30;40" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="90" r="1.5">
      <animate attributeName="cy" values="90;78;90" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="130" r="2">
      <animate attributeName="cy" values="130;118;130" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- editorial name -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <text x="60" y="108" font-size="11" letter-spacing="6" fill="#ff5a50">// WEB · AI · SHIPPED</text>
    <text x="58" y="170" font-size="84" fill="#f5f5f7" letter-spacing="2">FERREL</text>
    <text x="58" y="180" font-size="84" fill="none" stroke="#FF3B30" stroke-width="1.1" letter-spacing="2" opacity="0.7">
      GANENDRA
    </text>
  </g>

  <!-- bottom-left status -->
  <g font-family="'Menlo', monospace" font-size="12" fill="#8a8a8f">
    <text x="60" y="207">building tools that outlive the demo</text>
  </g>
  <!-- blinking cursor -->
  <rect x="322" y="198" width="8" height="14" fill="#FF3B30">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
