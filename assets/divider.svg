<?xml version="1.0" encoding="UTF-8"?>
<!-- Custom animated footer divider - thin red line with moving dot -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60">
  <rect width="900" height="60" fill="none"/>
  <!-- base line -->
  <line x1="20" y1="30" x2="880" y2="30" stroke="#25252a" stroke-width="1.5"/>
  <!-- moving pulse dot -->
  <circle r="5" fill="#FF3B30">
    <animateMotion dur="5s" repeatCount="indefinite" path="M20,30 L880,30"/>
  </circle>
  <!-- soft glow trail behind the dot is approximated by a second faint dot offset -->
  <circle r="9" fill="#FF3B30" opacity="0.25">
    <animateMotion dur="5s" repeatCount="indefinite" path="M20,30 L880,30"/>
  </circle>
</svg>
