<?xml version="1.0" encoding="UTF-8"?>
<!-- Custom info panel - dark cinematic, red accent, animated glow + grid -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#0A0A0C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="panelGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a1a1f" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="900" height="300" fill="#0A0A0C" rx="14"/>
  <rect width="900" height="300" fill="url(#panelGrid)" opacity="0.35" rx="14"/>
  <!-- top red accent line -->
  <rect x="0" y="0" width="900" height="3" fill="#FF3B30" opacity="0.9"/>

  <!-- left: label block -->
  <g font-family="'Helvetica Neue',Arial,sans-serif">
    <text x="44" y="56" font-size="12" letter-spacing="4" fill="#ff5a50" font-weight="700">PROFILE</text>
    <text x="44" y="96" font-size="34" fill="#f5f5f7" font-weight="800" letter-spacing="1">Facts</text>

    <text x="44" y="146" font-size="13" letter-spacing="3" fill="#ff5a50">LOCATION</text>
    <text x="150" y="146" font-size="14" fill="#c9d1d9">Yogyakarta, Indonesia</text>

    <text x="44" y="180" font-size="13" letter-spacing="3" fill="#ff5a50">ROLE</text>
    <text x="150" y="180" font-size="14" fill="#c9d1d9">AI Engineer · Web Developer</text>

    <text x="44" y="214" font-size="13" letter-spacing="3" fill="#ff5a50">FOCUS</text>
    <text x="150" y="214" font-size="14" fill="#c9d1d9">RAG · LLM tools · shipped apps</text>

    <text x="44" y="248" font-size="13" letter-spacing="3" fill="#ff5a50">STACK</text>
    <text x="150" y="248" font-size="14" fill="#c9d1d9">Python · TS · React · Next · FastAPI · Supabase</text>
  </g>

  <!-- right: animated orb -->
  <circle cx="760" cy="150" r="58" fill="#FF3B30" opacity="0.12">
    <animate attributeName="r" values="52;66;52" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.2;0.12" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="150" r="26" fill="#FF3B30" opacity="0.25">
    <animate attributeName="r" values="22;30;22" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- small tags bottom -->
  <g font-family="'Menlo',monospace" font-size="11" fill="#8a8a8f">
    <rect x="44" y="276" width="150" height="18" rx="3" fill="#16161a"/>
    <text x="54" y="289">= OPEN TO WORK</text>
  </g>
</svg>
